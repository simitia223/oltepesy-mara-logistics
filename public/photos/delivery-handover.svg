<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="A delivery being handed over and checked at a camp in the Maasai Mara">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d13"/>
      <stop offset="0.5" stop-color="#191310"/>
      <stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <radialGradient id="sun2" cx="0.28" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#d98b3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cf7a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carton2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a273"/>
      <stop offset="1" stop-color="#a37f52"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky2)"/>
  <rect width="900" height="600" fill="url(#sun2)"/>
  <circle cx="252" cy="240" r="44" fill="#e9b877" opacity="0.5"/>

  <!-- acacia + tents on the horizon -->
  <g fill="#0c0a08" opacity="0.85">
    <rect x="690" y="250" width="5" height="90"/>
    <path d="M692 258c-28 0-48 10-48 18 0 3 1 4 3 6 7-6 22-10 45-10s38 4 45 10c2-2 3-3 3-6 0-8-20-18-48-18z"/>
    <path d="M120 340l40-70 40 70z"/>
    <path d="M180 340l34-58 34 58z"/>
  </g>

  <!-- ground -->
  <rect x="0" y="404" width="900" height="196" fill="#0c0a08"/>
  <rect x="0" y="404" width="900" height="3" fill="#d98b3a" opacity="0.22"/>

  <!-- delivery vehicle (left) -->
  <g>
    <rect x="60" y="256" width="240" height="160" rx="6" fill="#171310" stroke="#3a2f26" stroke-width="2"/>
    <rect x="150" y="272" width="140" height="132" fill="#0d0b09"/>
    <circle cx="118" cy="416" r="25" fill="#0a0908"/><circle cx="118" cy="416" r="11" fill="#1c1712"/>
    <circle cx="252" cy="416" r="25" fill="#0a0908"/><circle cx="252" cy="416" r="11" fill="#1c1712"/>
  </g>

  <!-- crates on the ground -->
  <g>
    <rect x="330" y="330" width="104" height="74" fill="url(#carton2)" stroke="#7a5c3c" stroke-width="1.5"/>
    <line x1="382" y1="330" x2="382" y2="404" stroke="#7a5c3c" stroke-width="2"/>
    <rect x="360" y="278" width="90" height="52" fill="#b98b63" stroke="#6b503a" stroke-width="1.5"/>
    <rect x="444" y="344" width="80" height="60" fill="#8a6a45"/>
    <g stroke="#5b4632" stroke-width="4">
      <line x1="450" y1="350" x2="450" y2="398"/><line x1="468" y1="350" x2="468" y2="398"/>
      <line x1="486" y1="350" x2="486" y2="398"/><line x1="504" y1="350" x2="504" y2="398"/><line x1="518" y1="350" x2="518" y2="398"/>
    </g>
  </g>

  <!-- driver handing over -->
  <g fill="#0c0a08">
    <circle cx="556" cy="300" r="13"/>
    <path d="M540 314h32l5 66h-42z"/>
    <path d="M572 326l40 6-2 12-42-8z"/>
  </g>

  <!-- camp manager with clipboard -->
  <g fill="#0c0a08">
    <circle cx="636" cy="296" r="13"/>
    <path d="M620 310h32l6 70h-44z"/>
    <path d="M620 330l-22 6 3 12 23-8z"/>
    <rect x="590" y="330" width="24" height="30" rx="2" fill="#5b4632"/>
    <line x1="595" y1="338" x2="609" y2="338" stroke="#c9a273" stroke-width="2"/>
    <line x1="595" y1="345" x2="609" y2="345" stroke="#c9a273" stroke-width="2"/>
  </g>

  <!-- check mark -->
  <g>
    <circle cx="716" cy="150" r="26" fill="none" stroke="#7c9a68" stroke-width="3" opacity="0.8"/>
    <path d="M704 150l8 9 17-20" fill="none" stroke="#7c9a68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.7">
    <rect x="28" y="536" width="196" height="30" rx="6" fill="#0c0a08" stroke="#3a2f26" stroke-width="1"/>
    <text x="42" y="556" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#9a9083">PLACEHOLDER IMAGE</text>
  </g>
</svg>
