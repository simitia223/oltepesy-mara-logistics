name = "oltepesy-mara-logistics"
compatibility_date = "2026-09-02"
pages_build_output_dir = "out"

# Reviews storage (Cloudflare KV).
# The moderation token lives in this namespace under key "config:admin-token"
# — set/rotate it with:
#   npx wrangler kv key put --namespace-id <id> "config:admin-token" "<token>" --remote
[[kv_namespaces]]
binding = "REVIEWS"
id = "a5b43ef636f0451d96f49dc119c85418"
